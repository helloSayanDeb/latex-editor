name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: win
          - os: macos-15-intel
            arch: x64
            target: mac
          - os: macos-latest
            arch: arm64
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Electron is installed explicitly below; no native canvas build is needed.
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: node scripts/privacy-regressions.cjs
      - run: node scripts/image-regressions.cjs
      - run: node scripts/ai-conversation-regressions.cjs
      - run: npm run desktop:prepare
      - run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/test-packaged-startup.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: sha256sum *.exe *.dmg > SHA256SUMS.txt
        working-directory: installers
      - run: |
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            if [ -f "docs/releases/$TAG.md" ]; then
              gh release create "$TAG" --repo "$REPOSITORY" --title "TeXStudio Local $TAG" --notes-file "docs/releases/$TAG.md"
            else
              gh release create "$TAG" --repo "$REPOSITORY" --title "TeXStudio Local $TAG" --notes "Desktop installers with a bundled runtime. A separately installed TeX distribution is required for compilation. These installers are unsigned."
            fi
          fi
          gh release upload "$TAG" installers/* --repo "$REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
