appId: io.github.hellosayandeb.texstudio-local
productName: TeXStudio Local
directories:
  app: desktop-app
  output: dist-desktop
files:
  - desktop/main.cjs
  - package.json
  - '!node_modules/**/*'
npmRebuild: false
extraResources:
  - from: desktop-server
    to: server
  # electron-builder skips root node_modules in directory mappings.
  - from: desktop-server/node_modules
    to: server/node_modules
asar: true
win:
  icon: desktop/icon.png
  target: nsis
  artifactName: TeXStudio-Local-windows-${arch}.exe
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  runAfterFinish: false
mac:
  icon: desktop/icon.png
  target: dmg
  category: public.app-category.productivity
  artifactName: TeXStudio-Local-mac-${arch}.dmg
  identity: null
